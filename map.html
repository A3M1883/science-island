<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>خريطة جزيرة العلوم 👑</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:"Tajawal",sans-serif;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}

/* الشاشة الكاملة — الصورة كخلفية */
.screen{position:relative;aspect-ratio:3/2;width:min(100vw,calc(100vh * 3 / 2));height:min(100vh,calc(100vw * 2 / 3));
  background-image:url("map.jpeg");
  background-size:100% 100%;
  background-position:center;
  background-repeat:no-repeat;
  overflow:hidden;
}

/* ══ مناطق النقر الشفافة فوق القصور ══ */
.castle-zone{
  position:absolute;
  cursor:pointer;
  border-radius:50%;
  background:transparent; 
  border:none;
  z-index:20;
  transition:transform .18s ease;
}
.castle-zone:hover{transform:scale(1.12)}
.castle-zone:active{transform:scale(.95)}

/* توهج عند الهوفر */
.castle-zone::after{
  content:"";
  position:absolute;inset:-8px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);
  opacity:0;transition:opacity .2s;
  pointer-events:none;
}
.castle-zone:hover::after{opacity:1}

/* ══ بطاقات المعلومات (أعلى يسار / يمين) ══ */
/* بطاقة اللاعبة — أعلى يسار */
.player-overlay{
  position:absolute;
  top:10%;left:.8%;
  z-index:25;
  width:25%;
  pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:.12rem;
}

.player-name{
  color:#fff;
  font-size:clamp(1.6rem,1.4vw,.120rem);
  font-weight:700;
  text-align:center;
  text-shadow:0 0 8px rgba(255,215,0,.5),0 2px 4px rgba(0,0,0,.9);
  line-height:1.2;
}

/* بطاقة الإحصاء — أعلى يمين */
.stats-overlay{
  position:absolute;
  top:3.8%;right:20%;
  z-index:30;
  display:flex;flex-direction:column;gap:1.8rem;
  pointer-events:none;
}
.stat-row{
  display:flex;align-items:right;justify-content:flex-end;gap:.6rem;
}
.stat-lbl{
  color:rgba(255,215,0,.85);
  font-size:clamp(.9rem,1vw,.100rem);
  font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.stat-val{
  color:#fff;
  font-size:clamp(.9rem,1vw,.100rem);
  font-weight:800;
  min-width:28px;text-align:left;
  text-shadow:0 0 8px rgba(255,215,0,.5),0 2px 4px rgba(0,0,0,.9);
}

/* ══ Coming Soon modal ══ */
.cs-badge{
  display:inline-block;
  background:linear-gradient(135deg,#1a3a8f,#2855c8);
  border:1.5px solid rgba(255,215,0,.5);
  border-radius:20px;
  padding:.35rem 1.2rem;
  color:#ffd700;
  font-size:.85rem;
  font-weight:900;
  letter-spacing:.5px;
  margin:.5rem auto;
}

/* ══ تأثيرات حية ══ */
.sparkle{
  position:absolute;border-radius:50%;
  animation:sparkFly 3.5s ease-out forwards;
  pointer-events:none;z-index:15;
}
@keyframes sparkFly{
  0%{transform:translateY(0) scale(0);opacity:0}
  30%{opacity:1;transform:translateY(-16px) scale(1)}
  100%{transform:translateY(-50px) scale(0);opacity:0}
}

/* توهج جواهر المفتاح في الشريط السفلي */
.gem-glow-strip{
  position:absolute;
  bottom:4%;
  left:50%;transform:translateX(-50%);
  z-index:25;
  display:flex;gap:clamp(1.5rem,4vw,4rem);
  pointer-events:none;
}
.gem-dot{
  width:clamp(14px,2vw,22px);
  height:clamp(14px,2vw,22px);
  border-radius:50%;
  animation:gemPulse 2s ease-in-out infinite;
  opacity:.65;
}
@keyframes gemPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.5);opacity:1}}

/* ══ مودال ══ */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,50,.78);backdrop-filter:blur(5px);
  align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:linear-gradient(145deg,#060c38,#0d1a72,#050a2e);
  border:2px solid rgba(255,215,0,.65);border-radius:18px;
  padding:1.8rem 2rem;max-width:360px;width:90%;
  text-align:center;
  box-shadow:0 0 40px rgba(255,215,0,.2),0 20px 60px rgba(0,0,0,.6);
  animation:mIn .3s ease-out;
}
@keyframes mIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{font-size:2.2rem;margin-bottom:.5rem}
.modal-title{color:#ffd700;font-size:1.1rem;font-weight:900;margin-bottom:.4rem}
.modal-msg{color:#ddeeff;font-size:.9rem;line-height:1.75;margin-bottom:1.2rem;font-weight:600}
.modal-close{
  background:linear-gradient(135deg,#1a3a8f,#2855c8);
  border:2px solid #ffd700;border-radius:28px;
  padding:.5rem 1.8rem;
  font-family:"Tajawal",sans-serif;font-size:.9rem;font-weight:700;
  color:#ffd700;cursor:pointer;transition:all .2s;
}
.modal-close:hover{box-shadow:0 0 14px rgba(255,215,0,.45)}

/* لا تسجيل */
.no-reg{display:none;position:fixed;inset:0;z-index:300;background:rgba(4,8,36,.97);flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
.no-reg.show{display:flex}
</style>
</head>
<body>

<!-- لا يوجد تسجيل -->
<div class="no-reg" id="noReg">
  <div style="font-size:3rem">🏝️</div>
  <div style="color:#ffd700;font-size:1.3rem;font-weight:800">يرجى التسجيل أولاً</div>
  <div style="color:rgba(180,200,255,.7);font-size:.9rem">لا توجد بيانات محفوظة</div>
  <button onclick="location.href='register.html'" style="background:linear-gradient(135deg,#c8960a,#ffd700);border:none;border-radius:28px;padding:.65rem 1.8rem;font-family:Tajawal,sans-serif;font-size:.95rem;font-weight:800;color:#1a0800;cursor:pointer;margin-top:.3rem">📝 التسجيل</button>
</div>

<!-- الشاشة الرئيسية -->
<div class="screen" id="mainScreen">

  <!-- ══ اسم اللاعبة فوق البطاقة اليسرى ══ -->
  <div class="player-overlay">
    <div class="player-name" id="playerName">...</div>
  </div>

  <!-- ══ إحصائيات فوق البطاقة اليمنى ══ -->
  <div class="stats-overlay">
    <div class="stat-row"><span class="stat-lbl">⭐ المستوى</span><span class="stat-val" id="statLevel">—</span></div>
    <div class="stat-row"><span class="stat-lbl">💎 الجواهر</span><span class="stat-val" id="statGems">—</span></div>
    <div class="stat-row"><span class="stat-lbl">🏆 النقاط</span><span class="stat-val" id="statPoints">—</span></div>
  </div>


  <!-- ══ القلاع الأربع — مناطق نقر شفافة ══ -->

  <!-- قصر المعرفة — أزرق يسار، top≈38% left≈7% -->
  <div class="castle-zone" id="c1" style="top:38%;left:13%;width:14%;height:22%" onclick="enterCastle(1)"></div>

  <!-- قصر الفهم — أخضر يمين، top≈36% left≈69% -->
  <div class="castle-zone" id="c2" style="top:32%;left:72%;width:14%;height:22%" onclick="enterCastle(2)"></div>

  <!-- قصر التطبيق — برتقالي يمين وسط، top≈58% left≈62% -->
  <div class="castle-zone" id="c3" style="top:59%;left:60%;width:14%;height:22%" onclick="enterCastle(3)"></div>

  <!-- قصر التحليل — أحمر وسط يسار، top≈58% left≈25% -->
  <div class="castle-zone" id="c4" style="top:58%;left:30%;width:14%;height:22%" onclick="enterCastle(4)"></div>
  <!-- القلعة الملكية — وسط أعلى، top≈12% left≈37% -->
  <div class="castle-zone" id="c5"
    style="top:15%;left:37%;width:26%;height:28%;border-radius:8px"
    onclick="enterCastle(5)"></div>


  <!-- حاوية البريق المتطاير -->
  <div id="sparkleLayer" style="position:absolute;inset:0;z-index:10;pointer-events:none"></div>

</div>

<!-- مودال -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-icon"  id="modalIcon"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg"   id="modalMsg"></div>
    <button class="modal-close" onclick="closeModal()">حسناً 👑</button>
  </div>
</div>

<script>
/* ══ بيانات القصور ══ */
const CASTLES = {
  1:{icon:"💚", name:"قصر المعرفة",   sub:"التذكر – اذكر وتعلم",     color:"#00cc55", page:"palace1.html"},
  2:{icon:"💙", name:"قصر الفهم",     sub:"الفهم – افهم واستوعب",    color:"#2288ff", page:"palace2.html"},
  3:{icon:"🧡", name:"قصر التطبيق",   sub:"التطبيق – أطبق وأبدع",   color:"#ff8800", page:"palace3.html"},
  4:{icon:"💜", name:"قصر التحليل",   sub:"التحليل – أحلل وأفكر",   color:"#cc44ff", page:"palace4.html"},
  5:{icon:"👑", name:"القلعة الملكية الكبرى", sub:"تحدي التاج الملكي", color:"#ffd700", page:"palace5.html"}
};

/* ══ تحميل البيانات من localStorage ══ */
let student = null, progress = {gems:[], level:1, points:0};
try{
  student  = JSON.parse(localStorage.getItem("scienceIslandStudent")||"null");
  const pr = JSON.parse(localStorage.getItem("scienceIslandProgress")||"{}");
  if(Array.isArray(pr.gems))  progress.gems   = pr.gems;
  if(pr.level)                progress.level  = pr.level;
  if(pr.points)               progress.points = pr.points;
}catch(e){}

if(!student || !student.name){
  document.getElementById("noReg").classList.add("show");
} else {
  const lbl = student.titleLabel || (student.title==="princess"?"الأميرة":"الأمير");
  document.getElementById("playerName").textContent = lbl + " " + student.name;
}

/* ══ عرض الإحصاء ══ */
function updateStats(){
  document.getElementById("statLevel").textContent  = progress.level;
  document.getElementById("statGems").textContent   = progress.gems.length + " / 4";
  document.getElementById("statPoints").textContent = progress.points.toLocaleString("ar-EG");

  // إضاءة الجواهر المجمعة في الشريط السفلي
  [1,2,3,4].forEach(i=>{
    const dot = document.getElementById("gd"+i);
    if(!dot) return;
    if(progress.gems.includes(i)){
      dot.style.opacity       = "1";
      dot.style.filter        = "brightness(1.6)";
      dot.style.boxShadow     = "0 0 18px 5px " + (["#2288ff","#00cc55","#ff8800","#cc44ff"][i-1]);
      dot.style.animationDuration = "1s";
    }
  });

  // حالة زر تحدي النهاية
  const allFour = [1,2,3,4].every(i => progress.gems.includes(i));
  const rb = document.getElementById("royalBtn");
  if(allFour){
    rb.classList.remove("locked");
    document.getElementById("royalBtnIcon").textContent = "✨";
  } else {
    rb.classList.add("locked");
    document.getElementById("royalBtnIcon").textContent = "🔒";
  }
}
updateStats();

/* ══ دخول القصر ══ */
function enterCastle(id){
  const c = CASTLES[id];

  if(id === 5){
    const allFour = [1,2,3,4].every(i => progress.gems.includes(i));
    if(!allFour){
      openModal("🔒","القلعة الملكية مغلقة",
        `يجب جمع الجواهر الأربع أولاً لفتح تحدي النهاية.<br>
         <small style="color:rgba(180,220,255,.7)">
           جمعتِ حتى الآن: ${progress.gems.length} / 4 جواهر
         </small>`);
      return;
    }
    // كل الجواهر مجمعة — انتقل لتحدي النهاية
    location.href = c.page;
    return;
  }

  // انتقل مباشرة للقصر
  location.href = c.page;
}

/* ══ مودال ══ */
function openModal(icon, title, msg){
  document.getElementById("modalIcon").textContent  = icon;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalMsg").innerHTML     = msg;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ══ زر الصوت ══ */
let soundOn = false;
function toggleSound(){
  soundOn = !soundOn;
  const icon = document.getElementById("soundIcon");
  if(soundOn){
    icon.textContent = "🔇";
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(
      "مرحباً بكِ في خريطة جزيرة العلوم الملكية! " +
      "أنا حبيبة، أميرة الاستكشاف. " +
      "ابدئي من قصر المعرفة لتجمعي الجوهرة الزرقاء. " +
      "ثم انتقلي إلى قصر الفهم مع فرح، أميرة المعرفة، لتجمعي الجوهرة الخضراء. " +
      "بعدها، قصر التطبيق للجوهرة البرتقالية، ثم قصر التحليل للجوهرة البنفسجية. " +
      "بعد جمع الجواهر الأربع، ستفتح القلعة الملكية الكبرى وتحصلين على التاج. " +
      "حظاً موفقاً يا بطلتنا العبقرية!"
    );
    u.lang="ar-SA"; u.rate=.86; u.pitch=1.08;
    u.onend = ()=>{ soundOn=false; icon.textContent="🔊"; };
    speechSynthesis.speak(u);
  } else {
    speechSynthesis.cancel();
    icon.textContent = "🔊";
  }
}

/* ══ بريق متطاير حول الجواهر ══ */
const GEM_CENTERS = [
  {x:19,y:55},{x:79,y:55},{x:73,y:78},{x:29,y:78},{x:50,y:42}
];
const SP_COLORS = ["#ffd700","#00ffcc","#ff88ff","#88ddff","#ffaa00","#aaffaa"];
function spawnSpark(){
  const g = GEM_CENTERS[Math.floor(Math.random()*GEM_CENTERS.length)];
  const c = SP_COLORS[Math.floor(Math.random()*SP_COLORS.length)];
  const el = document.createElement("div");
  el.className = "sparkle";
  const sz = Math.random()*5+3;
  const ox = (Math.random()-.5)*4, oy=(Math.random()-.5)*4;
  el.style.cssText =
    "width:"+sz+"px;height:"+sz+"px;background:"+c+";"+
    "left:calc("+g.x+"% + "+ox+"%);" +
    "top:calc("+g.y+"% + "+oy+"%);" +
    "animation-duration:"+(2.5+Math.random()*2)+"s";
  document.getElementById("sparkleLayer").appendChild(el);
  setTimeout(()=>el.remove(),4500);
}
setInterval(spawnSpark,380);
</script>
</body>
</html>
