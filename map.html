<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>خريطة جزيرة العلوم 👑</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:"Tajawal",sans-serif;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}

.screen{position:relative;aspect-ratio:3/2;width:min(100vw,calc(100vh * 3 / 2));height:min(100vh,calc(100vw * 2 / 3));
  background-image:url("map.jpeg");
  background-size:100% 100%;
  background-position:center;
  background-repeat:no-repeat;
  overflow:hidden;
}

.castle-zone{
  position:absolute;
  cursor:pointer;
  border-radius:50%;
  background:transparent; 
  border:none;
  z-index:20;
  transition:transform .18s ease;
}
.castle-zone:hover{transform:scale(1.12)}
.castle-zone:active{transform:scale(.95)}

.castle-zone::after{
  content:"";
  position:absolute;inset:-8px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);
  opacity:0;transition:opacity .2s;
  pointer-events:none;
}
.castle-zone:hover::after{opacity:1}

/* Mobile responsive overlays */
.player-overlay{
  position:absolute;
  top: 5%;
  left: 50%;
  transform: translateX(-50%);
  width: auto;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.12rem;
  background: rgba(0,0,0,0.4);
  padding: 5px 15px;
  border-radius: 30px;
  backdrop-filter: blur(4px);
  z-index:25;
}

.player-name{
  color:#fff;
  font-size: clamp(0.8rem, 2.5vw, 1.2rem);
  font-weight:700;
  text-align:center;
  text-shadow:0 0 8px rgba(255,215,0,.5),0 2px 4px rgba(0,0,0,.9);
  white-space: nowrap;
}

.stats-overlay{
  position:absolute;
  bottom: 8%;
  right: 3%;
  z-index:30;
  display:flex;
  flex-direction:column;
  gap:0.5rem;
  background: rgba(0,0,0,0.4);
  padding: 8px 12px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
}
.stat-row{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:.4rem;
}
.stat-lbl{
  color:rgba(255,215,0,.85);
  font-size: clamp(0.65rem, 2vw, 0.85rem);
  font-weight:700;
}
.stat-val{
  color:#fff;
  font-size: clamp(0.65rem, 2vw, 0.85rem);
  font-weight:800;
  min-width:35px;
  text-align:left;
}

/* Mobile adjustments */
@media (max-width: 768px) {
  .player-overlay {
    top: 3%;
    padding: 3px 10px;
  }
  .stats-overlay {
    bottom: 5%;
    right: 2%;
    padding: 5px 10px;
    gap: 0.3rem;
  }
  .stat-row {
    gap: 0.2rem;
  }
  .castle-zone {
    transform: scale(0.9);
  }
}

.cs-badge{
  display:inline-block;
  background:linear-gradient(135deg,#1a3a8f,#2855c8);
  border:1.5px solid rgba(255,215,0,.5);
  border-radius:20px;
  padding:.35rem 1.2rem;
  color:#ffd700;
  font-size:.85rem;
  font-weight:900;
  letter-spacing:.5px;
  margin:.5rem auto;
}

.sparkle{
  position:absolute;border-radius:50%;
  animation:sparkFly 3.5s ease-out forwards;
  pointer-events:none;z-index:15;
}
@keyframes sparkFly{
  0%{transform:translateY(0) scale(0);opacity:0}
  30%{opacity:1;transform:translateY(-16px) scale(1)}
  100%{transform:translateY(-50px) scale(0);opacity:0}
}

.modal-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,50,.78);backdrop-filter:blur(5px);
  align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal-box{
  background:linear-gradient(145deg,#060c38,#0d1a72,#050a2e);
  border:2px solid rgba(255,215,0,.65);border-radius:18px;
  padding:1.8rem 2rem;max-width:360px;width:90%;
  text-align:center;
  box-shadow:0 0 40px rgba(255,215,0,.2),0 20px 60px rgba(0,0,0,.6);
}
.modal-icon{font-size:2.2rem;margin-bottom:.5rem}
.modal-title{color:#ffd700;font-size:1.1rem;font-weight:900;margin-bottom:.4rem}
.modal-msg{color:#ddeeff;font-size:.9rem;line-height:1.75;margin-bottom:1.2rem}
.modal-close{
  background:linear-gradient(135deg,#1a3a8f,#2855c8);
  border:2px solid #ffd700;border-radius:28px;
  padding:.5rem 1.8rem;
  font-family:"Tajawal",sans-serif;font-size:.9rem;font-weight:700;
  color:#ffd700;cursor:pointer;
}
.modal-close:hover{box-shadow:0 0 14px rgba(255,215,0,.45)}

.no-reg{display:none;position:fixed;inset:0;z-index:300;background:rgba(4,8,36,.97);flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
.no-reg.show{display:flex}
</style>
</head>
<body>

<div class="no-reg" id="noReg">
  <div style="font-size:3rem">🏝️</div>
  <div style="color:#ffd700;font-size:1.3rem;font-weight:800">يرجى التسجيل أولاً</div>
  <div style="color:rgba(180,200,255,.7);font-size:.9rem">لا توجد بيانات محفوظة</div>
  <button onclick="location.href='register.html'" style="background:linear-gradient(135deg,#c8960a,#ffd700);border:none;border-radius:28px;padding:.65rem 1.8rem;font-family:Tajawal,sans-serif;font-size:.95rem;font-weight:800;color:#1a0800;cursor:pointer;margin-top:.3rem">📝 التسجيل</button>
</div>

<div class="screen" id="mainScreen">
  <div class="player-overlay">
    <div class="player-name" id="playerName">الأميرة ...</div>
  </div>

  <div class="stats-overlay">
    <div class="stat-row"><span class="stat-lbl">⭐ المستوى</span><span class="stat-val" id="statLevel">—</span></div>
    <div class="stat-row"><span class="stat-lbl">💎 الجواهر</span><span class="stat-val" id="statGems">—</span></div>
    <div class="stat-row"><span class="stat-lbl">🏆 النقاط</span><span class="stat-val" id="statPoints">—</span></div>
  </div>

  <!-- Castle zones -->
  <div class="castle-zone" id="c1" style="top:38%;left:13%;width:14%;height:22%" onclick="enterCastle(1)"></div>
  <div class="castle-zone" id="c2" style="top:32%;left:72%;width:14%;height:22%" onclick="enterCastle(2)"></div>
  <div class="castle-zone" id="c3" style="top:59%;left:60%;width:14%;height:22%" onclick="enterCastle(3)"></div>
  <div class="castle-zone" id="c4" style="top:58%;left:30%;width:14%;height:22%" onclick="enterCastle(4)"></div>
  <div class="castle-zone" id="c5" style="top:15%;left:37%;width:26%;height:28%;border-radius:8px" onclick="enterCastle(5)"></div>

  <div id="sparkleLayer" style="position:absolute;inset:0;z-index:10;pointer-events:none"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-icon" id="modalIcon"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg" id="modalMsg"></div>
    <button class="modal-close" onclick="closeModal()">حسناً 👑</button>
  </div>
</div>

<script>
// Castle order: c2 - c1 - c3 - c4 - c5
const CASTLE_ORDER = [2, 1, 3, 4, 5];

const CASTLES = {
  1:{icon:"💚", name:"قصر المعرفة", color:"#00cc55", page:"palace1.html"},
  2:{icon:"💙", name:"قصر الفهم", color:"#2288ff", page:"palace2.html"},
  3:{icon:"🧡", name:"قصر التطبيق", color:"#ff8800", page:"palace3.html"},
  4:{icon:"💜", name:"قصر التحليل", color:"#cc44ff", page:"palace4.html"},
  5:{icon:"👑", name:"القلعة الملكية الكبرى", color:"#ffd700", page:"palace5.html"}
};

let student = null;
let progress = {gems: [], level: 1, points: 0, completedCastles: [], castleScores: {}};
let currentStudentCode = null;

function loadData() {
  try {
    currentStudentCode = localStorage.getItem('currentStudentCode');
    if (currentStudentCode) {
      const storedProgress = localStorage.getItem('scienceIslandProgress_' + currentStudentCode);
      if (storedProgress) {
        const parsed = JSON.parse(storedProgress);
        progress.gems = parsed.gems || [];
        progress.level = parsed.level || 1;
        progress.points = parsed.points || 0;
        progress.completedCastles = parsed.completedCastles || [];
        progress.castleScores = parsed.castleScores || {};
      }
    }
    student = JSON.parse(localStorage.getItem('scienceIslandStudent') || 'null');
    if (student && student.name) {
      document.getElementById("playerName").textContent = "الأميرة " + student.name;
    }
  } catch(e) { console.error(e); }
}

function updateStats(){
  document.getElementById("statLevel").textContent = progress.level;
  document.getElementById("statGems").textContent = progress.gems.length + " / 4";
  document.getElementById("statPoints").textContent = progress.points.toLocaleString("ar-EG");
}

function isCastleAvailable(castleId) {
  const currentIndex = CASTLE_ORDER.indexOf(castleId);
  if (currentIndex === 0) return true; // First castle always available
  
  // Check if previous castle in order is completed
  const previousCastle = CASTLE_ORDER[currentIndex - 1];
  return progress.completedCastles.includes(previousCastle);
}

function saveProgress() {
  try {
    if (currentStudentCode) {
      const dataToSave = {
        gems: progress.gems,
        level: progress.level,
        points: progress.points,
        completedCastles: progress.completedCastles,
        castleScores: progress.castleScores
      };
      localStorage.setItem('scienceIslandProgress_' + currentStudentCode, JSON.stringify(dataToSave));
    }
  } catch(e) { console.error(e); }
}

function openModal(icon, title, msg){
  document.getElementById("modalIcon").textContent = icon;
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalMsg").innerHTML = msg;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){ document.getElementById("modal").classList.remove("show"); }

function enterCastle(id){
  const c = CASTLES[id];
  
  if (id === 5) {
    const allFour = [1,2,3,4].every(i => progress.gems.includes(i));
    if(!allFour){
      openModal("🔒","القلعة الملكية مغلقة",
        `يجب جمع الجواهر الأربع أولاً لفتح تحدي النهاية.<br>
         <small style="color:rgba(180,220,255,.7)">جمعتِ حتى الآن: ${progress.gems.length} / 4 جواهر</small>`);
      return;
    }
    location.href = c.page + "?completed=" + (progress.completedCastles.includes(5) ? 'true' : 'false');
    return;
  }
  
  // Check castle availability based on order
  if (!isCastleAvailable(id)) {
    const orderIndex = CASTLE_ORDER.indexOf(id);
    const requiredCastle = CASTLE_ORDER[orderIndex - 1];
    openModal("🔒", "القصر مغلق", 
      `يجب إكمال ${CASTLES[requiredCastle].name} أولاً (بنسبة 100%)<br>
       <small style="color:rgba(180,220,255,.7)">ترتيب القصور: قصر الفهم → قصر المعرفة → قصر التطبيق → قصر التحليل</small>`);
    return;
  }
  
  // Check if already completed with 10/10
  const isCompleted = progress.completedCastles.includes(id);
  location.href = c.page + "?completed=" + (isCompleted ? 'true' : 'false') + "&castleId=" + id;
}

loadData();
updateStats();

if(!student || !student.name){
  document.getElementById("noReg").classList.add("show");
}

const GEM_CENTERS = [{x:19,y:55},{x:79,y:55},{x:73,y:78},{x:29,y:78},{x:50,y:42}];
const SP_COLORS = ["#ffd700","#00ffcc","#ff88ff","#88ddff","#ffaa00","#aaffaa"];

function spawnSpark(){
  const g = GEM_CENTERS[Math.floor(Math.random()*GEM_CENTERS.length)];
  const c = SP_COLORS[Math.floor(Math.random()*SP_COLORS.length)];
  const el = document.createElement("div");
  el.className = "sparkle";
  const sz = Math.random()*5+3;
  const ox = (Math.random()-.5)*4, oy=(Math.random()-.5)*4;
  el.style.cssText = "width:"+sz+"px;height:"+sz+"px;background:"+c+";left:calc("+g.x+"% + "+ox+"%);top:calc("+g.y+"% + "+oy+"%);animation-duration:"+(2.5+Math.random()*2)+"s";
  document.getElementById("sparkleLayer").appendChild(el);
  setTimeout(()=>el.remove(),4500);
}
setInterval(spawnSpark,380);
</script>
</body>
</html>
