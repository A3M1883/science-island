<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>💚 قصر المعرفة – جزيرة العلوم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;font-family:"Tajawal",sans-serif;
  background:linear-gradient(160deg,#040e2e 0%,#081840 50%,#040e2e 100%);
  color:#fff;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.3rem;
  padding:.5rem 1rem;background:rgba(4,8,40,.92);
  border-bottom:1.5px solid rgba(255,215,0,.3);backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:50}
.tb-name{font-size:.78rem;font-weight:700;color:#ffd700;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-ttl{font-size:.78rem;font-weight:700;color:rgba(200,220,255,.8)}
.tb-gems{font-size:.78rem;color:rgba(180,210,255,.65)}
.wrap{max-width:700px;margin:0 auto;padding:1.2rem 1rem 4rem}
.ph{text-align:center;padding:.8rem 0 .5rem;border-bottom:1px solid rgba(255,215,0,.2);margin-bottom:1.1rem}
.pi{font-size:2.2rem;display:block;margin-bottom:.18rem;
  animation:iconPulse 2.5s ease-in-out infinite;
  filter:drop-shadow(0 0 8px #00cc55)}
@keyframes iconPulse{0%,100%{filter:drop-shadow(0 0 5px #00cc55)}50%{filter:drop-shadow(0 0 18px #00cc55)}}
.ptitle{font-size:clamp(1.2rem,3.5vw,1.8rem);font-weight:900;color:#ffd700}
.psub{color:rgba(160,200,255,.65);font-size:.82rem;margin-top:.12rem}
.progw{margin-bottom:1rem}
.proginfo{display:flex;justify-content:space-between;font-size:.74rem;color:rgba(180,210,255,.6);margin-bottom:.28rem}
.progtrack{height:9px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;border:1px solid rgba(255,215,0,.15)}
.progfill{height:100%;background:linear-gradient(90deg,#00cc55,#00ff88);border-radius:5px;transition:width .5s}
.qcard{background:rgba(255,255,255,.055);border:1.5px solid rgba(255,215,0,.28);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:.9rem}
.qnum{color:rgba(255,215,0,.62);font-size:.74rem;font-weight:700;margin-bottom:.4rem}
.qtext{font-size:clamp(.94rem,2.5vw,1.15rem);font-weight:700;line-height:1.65;color:#e8f0ff;margin-bottom:.95rem}
.opts{display:grid;gap:.58rem}
.opt{background:rgba(255,255,255,.055);border:1.5px solid rgba(255,215,0,.2);
  border-radius:11px;padding:.65rem .9rem;
  font-family:"Tajawal",sans-serif;font-size:.93rem;font-weight:600;
  color:#ddeeff;text-align:right;cursor:pointer;
  transition:all .17s;display:flex;align-items:center;gap:.52rem}
.opt:hover:not(:disabled){background:rgba(255,215,0,.1);border-color:#ffd700;color:#fff}
.opt.correct{background:rgba(0,200,80,.16);border-color:#00dd66;color:#aaffcc}
.opt.wrong{background:rgba(210,40,50,.14);border-color:#ff4455;color:#ffaaaa}
.opt:disabled{cursor:default}
.optl{width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:.74rem;font-weight:900;color:#ffd700}
.res{text-align:center;font-size:.98rem;font-weight:700;padding:.4rem;margin-top:.65rem;border-radius:7px;display:none}
.res.ok{color:#00ee77;display:block}
.res.no{color:#ff6677;display:block}
.btnnext{width:100%;margin-top:.85rem;
  background:linear-gradient(135deg,#1a3a8f,#2855c8);
  border:2px solid #ffd700;border-radius:45px;padding:.68rem;
  font-family:"Tajawal",sans-serif;font-size:.98rem;font-weight:800;
  color:#ffd700;cursor:pointer;display:none}
.btnnext.show{display:block}
.endscreen{display:none;text-align:center;padding:1.8rem .8rem}
.endscreen.show{display:block}
.endgem{font-size:clamp(3rem,8vw,5rem);display:block;margin:0 auto .4rem;
  animation:gemDrop .55s ease-out;filter:drop-shadow(0 0 18px #00cc55)}
@keyframes gemDrop{from{transform:scale(0) rotate(-18deg);opacity:0}70%{transform:scale(1.1) rotate(4deg)}to{transform:scale(1);opacity:1}}
.endtitle{font-size:clamp(1.3rem,3.8vw,2rem);font-weight:900;color:#ffd700;margin-bottom:.35rem}
.stars{font-size:1.8rem;letter-spacing:.2rem;margin:.4rem 0}
.enddetail{color:rgba(175,210,255,.8);font-size:.92rem;line-height:1.7;margin-bottom:1rem}
.btnmap{display:inline-block;margin-top:.8rem;
  background:linear-gradient(135deg,#c8960a,#ffd700);
  border:none;border-radius:45px;padding:.78rem 2.2rem;
  font-family:"Tajawal",sans-serif;font-size:1rem;font-weight:900;
  color:#1a0800;cursor:pointer}
.failscreen{display:none;text-align:center;padding:1.8rem .8rem}
.failscreen.show{display:block}
.fail-icon{font-size:3rem;display:block;margin-bottom:.4rem}
.fail-title{color:#ff8888;font-size:1.5rem;font-weight:900;margin-bottom:.4rem}
.fail-msg{color:rgba(200,180,180,.8);font-size:.9rem;line-height:1.7;margin-bottom:1rem}
.loading-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.8);align-items:center;justify-content:center;flex-direction:column;gap:1rem}
.loading-overlay.show{display:flex}
.spinner{width:40px;height:40px;border:4px solid rgba(255,215,0,.3);border-top-color:#ffd700;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.cp{position:absolute;top:-12px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media (max-width: 768px) {
  .wrap{padding:1rem}
  .qcard{padding:1rem}
  .opt{padding:.5rem .7rem;font-size:.85rem}
}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="color:#ffd700">جاري حفظ التقدم...</div>
</div>
<div class="cl" id="cl"></div>
<div class="topbar">
  <span class="tb-name" id="tbName">—</span>
  <span class="tb-ttl">💚 قصر المعرفة</span>
  <span class="tb-gems">💎 <span id="tbGems">0</span>/4</span>
  <button onclick="exitPalace()" style="background:rgba(255,215,0,.15);border:1px solid #ffd700;color:#ffd700;border-radius:20px;padding:.25rem .75rem;font-family:Tajawal,sans-serif;font-weight:700;font-size:.78rem;cursor:pointer">↩ خروج</button>
</div>
<div class="wrap">
  <div class="ph">
    <span class="pi">💚</span>
    <div class="ptitle">قصر المعرفة</div>
    <div class="psub">مستوى: التذكر · أجيبي على 10 أسئلة بشكل صحيح للحصول على 100 نقطة والجوهرة الخضراء!</div>
  </div>
  <div class="progw">
    <div class="proginfo">
      <span id="progLbl">السؤال 1 من 10</span>
      <span id="progPts">النقاط: 0</span>
    </div>
    <div class="progtrack"><div class="progfill" id="pf" style="width:0%"></div></div>
  </div>
  <div id="qSection">
    <div class="qcard" id="qCard">
      <div class="qnum" id="qNum">السؤال 1 من 10</div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="opts"></div>
      <div class="res" id="res"></div>
    </div>
    <button class="btnnext" id="btnNext" onclick="nextQ()">التالي ←</button>
  </div>
  <div class="endscreen" id="endScreen">
    <span class="endgem">💚</span>
    <div class="endtitle">أحسنتِ! جمعتِ جوهرة المعرفة!</div>
    <div class="stars" id="starsRow">⭐⭐⭐</div>
    <div class="enddetail" id="endDetail"></div>
    <button class="btnmap" onclick="location.href='map.html'">🗺️ العودة للخريطة</button>
  </div>
  <div class="failscreen" id="failScreen">
    <span class="fail-icon">💪</span>
    <div class="fail-title">قاربتِ على النجاح!</div>
    <div class="fail-msg" id="failMsg"></div>
    <button class="btnmap" onclick="restart()" style="background:linear-gradient(135deg,#1a3a8f,#2855c8);color:#ffd700">🔄 إعادة المحاولة</button>
    <br>
    <button class="btnmap" onclick="location.href='map.html'" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,215,0,.3);color:rgba(200,215,255,.7);font-size:.85rem;padding:.5rem 1.5rem;margin-top:.5rem">↩ الخريطة</button>
  </div>
</div>

<script>
// ============================================
// GITHUB CONFIGURATION - REPLACE WITH YOUR NEW TOKEN
// ============================================
const GITHUB_TOKEN = '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';  // 👈 PUT YOUR NEW TOKEN HERE
const GITHUB_REPO = 'a3m1883/science-island';
const DATA_FILE_PATH = 'data/students.json';
// ============================================

const PID = 1;  // Palace ID (1 for GREEN gem 💚)
const TOTAL = 10;
const PASS_SCORE = 10;

// Original questions for Palace 1 (المعرفة) - GREEN GEM
const ORIGINAL_QS = [
  {"text": "يستخرج الألومنيوم من:", "opts": ["خام الهيماتيت", "خام البوكسيت", "الكبريت", "الفلوريت"], "correctIndex": 1},
  {"text": "في أي عضية تحدث عملية البناء الضوئي؟", "opts": ["الميتوكوندريا", "البلاستيدات الخضراء", "الريبوسومات", "الفجوات"], "correctIndex": 1},
  {"text": "في أي عضية تحدث عملية التنفس الخلوي؟", "opts": ["البلاستيدات الخضراء", "جهاز جولجي", "الميتوكوندريا", "الفجوة"], "correctIndex": 2},
  {"text": "ما أكبر جسم في النظام الشمسي؟", "opts": ["الأرض", "المشتري", "الشمس", "زحل"], "correctIndex": 2},
  {"text": "ما أسرع الكواكب دوراناً حول الشمس؟", "opts": ["الأرض", "المريخ", "عطارد", "زحل"], "correctIndex": 2},
  {"text": "ما المقصود بالاستصلاح؟", "opts": ["إزالة الغابات", "إعادة تغطية الأراضي المنقبة بالتربة وزراعتها بالنباتات", "استخراج المعادن", "بناء السدود"], "correctIndex": 1},
  {"text": "ما المقصود بالانسياب السطحي؟", "opts": ["المياه الجوفية", "مياه البحار", "مياه الأمطار التي لا تتشربها الأرض فتجري على سطحها", "المياه المتبخرة"], "correctIndex": 2},
  {"text": "ما نوع المادة العضوية التي يتكون منها الفحم؟", "opts": ["بقايا العوالق البحرية", "بقايا نباتات المستنقعات", "بقايا الزواحف", "بقايا الديناصورات"], "correctIndex": 1},
  {"text": "ما المقصود بالمحميات؟", "opts": ["مناطق استخراج المعادن", "مناطق يمنع فيها قطع الأشجار أو البناء إلا وفق ضوابط محددة", "مناطق تخزين الوقود الأحفوري", "مناطق لا تحتوي على نباتات"], "correctIndex": 1},
  {"text": "أي الموارد الآتية يعد من الموارد المعدنية الفلزية؟", "opts": ["الكبريت", "الفلوريت", "الحديد", "الهاليت"], "correctIndex": 2}
];

// Function to shuffle array
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Function to randomize options for a question
function randomizeQuestion(q) {
  const optionsWithIndices = q.opts.map((opt, idx) => ({
    text: opt,
    originalIndex: idx,
    isCorrect: idx === q.correctIndex
  }));
  
  const shuffled = shuffleArray([...optionsWithIndices]);
  const newCorrectIndex = shuffled.findIndex(opt => opt.isCorrect);
  
  return {
    text: q.text,
    opts: shuffled.map(opt => opt.text),
    correctIndex: newCorrectIndex
  };
}

// Generate randomized question set
function generateRandomizedQuestions() {
  const randomized = [];
  for (let i = 0; i < ORIGINAL_QS.length; i++) {
    randomized.push(randomizeQuestion(ORIGINAL_QS[i]));
  }
  return randomized;
}

// Store the current randomized questions
let QS = [];

let cur = 0, score = 0, done = false;
let student = null, progress = null, currentStudentCode = null;
let isAlreadyCompleted = false;

// GitHub API functions
async function fetchAllData() {
  try {
    const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE_PATH}`;
    const response = await fetch(url, {
      headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
    });
    if (response.status === 404) {
      return { students: [], leaderboard: [] };
    }
    const data = await response.json();
    const content = atob(data.content);
    return JSON.parse(content);
  } catch(e) {
    console.error('Error fetching data:', e);
    return { students: [], leaderboard: [] };
  }
}

async function updateCloudData(studentData, progressData) {
  const loadingDiv = document.getElementById('loadingOverlay');
  loadingDiv.classList.add('show');
  
  try {
    const allData = await fetchAllData();
    
    const existingIndex = allData.students.findIndex(s => s.studentCode === studentData.studentCode);
    if (existingIndex >= 0) {
      allData.students[existingIndex].progress = progressData;
      allData.students[existingIndex].lastUpdated = new Date().toISOString();
    }
    
    const leaderboardEntry = {
      name: studentData.name,
      title: "الأميرة",
      cls: studentData.cls,
      gems: progressData.gems ? progressData.gems.length - 1 : 0,
      points: progressData.points || 0,
      studentCode: studentData.studentCode,
      date: new Date().toLocaleDateString('ar-AE')
    };
    
    const lbIndex = allData.leaderboard.findIndex(lb => lb.studentCode === studentData.studentCode);
    if (lbIndex >= 0) {
      if (leaderboardEntry.points >= allData.leaderboard[lbIndex].points) {
        allData.leaderboard[lbIndex] = leaderboardEntry;
      }
    } else {
      allData.leaderboard.push(leaderboardEntry);
    }
    
    allData.leaderboard.sort((a, b) => b.points - a.points);
    
    const updatedContent = btoa(unescape(encodeURIComponent(JSON.stringify(allData, null, 2))));
    
    let sha = null;
    try {
      const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE_PATH}`;
      const response = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
      if (response.ok) {
        const fileData = await response.json();
        sha = fileData.sha;
      }
    } catch(e) {}
    
    await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE_PATH}`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${GITHUB_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Update student progress: ${studentData.name}`,
        content: updatedContent,
        sha: sha
      })
    });
    
    return true;
  } catch(e) {
    console.error('Error saving to GitHub:', e);
    return false;
  } finally {
    loadingDiv.classList.remove('show');
  }
}

function loadData() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    isAlreadyCompleted = urlParams.get('completed') === 'true';
    
    currentStudentCode = localStorage.getItem('currentStudentCode');
    if (currentStudentCode) {
      const storedProgress = localStorage.getItem('scienceIslandProgress_' + currentStudentCode);
      if (storedProgress) {
        progress = JSON.parse(storedProgress);
      } else {
        progress = { gems: [], level: 1, points: 0, completedCastles: [], castleScores: {} };
      }
    }
    student = JSON.parse(localStorage.getItem('scienceIslandStudent') || 'null');
    if (student && student.name) {
      document.getElementById("tbName").textContent = "الأميرة " + student.name;
    }
    document.getElementById("tbGems").textContent = progress ? (progress.gems?.length || 0) : 0;
    
    QS = generateRandomizedQuestions();
    
    if (isAlreadyCompleted && progress && progress.completedCastles && progress.completedCastles.includes(PID)) {
      document.getElementById("qSection").style.display = "none";
      document.getElementById("endScreen").classList.add("show");
      const existingScore = progress.castleScores ? progress.castleScores[PID] : 0;
      document.getElementById("endDetail").innerHTML = `لقد أكملتِ هذا القصر بالفعل وحصلتِ على ${existingScore} نقطة!<br>يمكنكِ التوجه للقصر التالي. 🎉`;
      document.getElementById("starsRow").textContent = "🏆🏆🏆";
      return;
    }
  } catch(e) { console.error(e); }
  
  if (!isAlreadyCompleted) {
    showQ();
  }
}

async function saveProgress() {
  if (!currentStudentCode) return;
  try {
    if (!progress) {
      progress = { gems: [], level: 1, points: 0, completedCastles: [], castleScores: {} };
    }
    
    if (!isAlreadyCompleted && score === 10) {
      if (!progress.gems) progress.gems = [];
      if (!progress.gems.includes(PID)) {
        progress.gems.push(PID);
      }
      
      const pointsEarned = 100;
      progress.points = (progress.points || 0) + pointsEarned;
      
      if (!progress.completedCastles) progress.completedCastles = [];
      if (!progress.completedCastles.includes(PID)) {
        progress.completedCastles.push(PID);
      }
      
      if (!progress.castleScores) progress.castleScores = {};
      progress.castleScores[PID] = pointsEarned;
      progress.level = Math.max(progress.level || 1, progress.gems.length + 1);
    }
    
    const dataToSave = {
      gems: progress.gems,
      level: progress.level,
      points: progress.points,
      completedCastles: progress.completedCastles,
      castleScores: progress.castleScores
    };
    localStorage.setItem('scienceIslandProgress_' + currentStudentCode, JSON.stringify(dataToSave));
    
    if (student && student.studentCode) {
      await updateCloudData(student, dataToSave);
    }
    
  } catch(e) { console.error(e); }
}

function showQ() {
  if (cur >= TOTAL) { endPalace(); return; }
  const q = QS[cur]; done = false;
  document.getElementById("qNum").textContent = "السؤال " + (cur + 1) + " من " + TOTAL;
  document.getElementById("qText").textContent = q.text;
  document.getElementById("progLbl").textContent = "السؤال " + (cur + 1) + " من " + TOTAL;
  document.getElementById("progPts").textContent = "النقاط: " + (score * 10);
  document.getElementById("pf").style.width = (cur / TOTAL * 100) + "%";
  document.getElementById("res").className = "res";
  document.getElementById("res").innerHTML = "";
  document.getElementById("btnNext").classList.remove("show");
  const ow = document.getElementById("opts"); ow.innerHTML = "";
  const L = ["أ", "ب", "ج", "د"];
  q.opts.forEach((opt, i) => {
    const b = document.createElement("button"); b.className = "opt";
    b.innerHTML = `<span class="optl">${L[i]}</span>${opt}`;
    b.onclick = () => check(i, b, q);
    ow.appendChild(b);
  });
}

function check(idx, btn, q) {
  if (done) return; done = true;
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  const r = document.getElementById("res");
  if (idx === q.correctIndex) {
    btn.classList.add("correct"); score++;
    r.textContent = "✅ إجابة صحيحة! (+10 نقاط)"; r.className = "res ok";
  } else {
    btn.classList.add("wrong");
    document.querySelectorAll(".opt")[q.correctIndex].classList.add("correct");
    r.textContent = "❌ الإجابة الصحيحة: " + q.opts[q.correctIndex]; r.className = "res no";
  }
  document.getElementById("progPts").textContent = "النقاط: " + (score * 10);
  const nb = document.getElementById("btnNext"); nb.classList.add("show");
  nb.textContent = (cur < TOTAL - 1) ? "التالي ←" : "🏁 إنهاء القصر";
}

function nextQ() { cur++; showQ(); }

function endPalace() {
  document.getElementById("qSection").style.display = "none";
  document.getElementById("pf").style.width = "100%";
  
  if (score >= PASS_SCORE) {
    saveProgress();
    document.getElementById("endScreen").classList.add("show");
    document.getElementById("endDetail").innerHTML = `أجبتِ على جميع الأسئلة العشرة بشكل صحيح!<br>حصلتِ على 100 نقطة والجوهرة الخضراء! 🎉💚`;
    document.getElementById("starsRow").textContent = "⭐⭐⭐";
    confetti();
  } else {
    document.getElementById("failScreen").classList.add("show");
    document.getElementById("failMsg").innerHTML = `أجبتِ بشكل صحيح على ${score} من 10 أسئلة.<br>تحتاجين إجابات صحيحة لجميع الأسئلة العشرة للحصول على الجوهرة و100 نقطة.`;
  }
}

function restart() {
  QS = generateRandomizedQuestions();
  cur = 0; score = 0; done = false;
  document.getElementById("endScreen").classList.remove("show");
  document.getElementById("failScreen").classList.remove("show");
  document.getElementById("qSection").style.display = "";
  showQ();
}

function exitPalace() {
  if (confirm("هل تريدين الخروج؟")) {
    location.href = 'map.html';
  }
}

function confetti() {
  const w = document.getElementById("cl");
  const cols = ["#ffd700", "#00ff88", "#ff88cc", "#88ddff", "#ffaa00", "#cc88ff"];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement("div"); c.className = "cp";
    const sz = 6 + Math.random() * 8;
    c.style.cssText = "left:" + (Math.random() * 100) + "vw;background:" + cols[~~(Math.random() * cols.length)] +
      ";animation-duration:" + (2 + Math.random() * 3) + "s;animation-delay:" + (Math.random() * 1.2) + "s;" +
      "width:" + sz + "px;height:" + sz + "px;border-radius:" + (Math.random() > .5 ? "50%" : "2px") + ";";
    w.appendChild(c); setTimeout(() => c.remove(), 5500);
  }
}

loadData();
</script>
</body>
