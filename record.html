<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>📚 سجل الطالبات – جزيرة العلوم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:linear-gradient(160deg,#040e2e,#081840,#040e2e);min-height:100vh;color:#fff;padding:2rem}
.container{max-width:1400px;margin:0 auto}
.header{text-align:center;margin-bottom:2rem}
.header h1{color:#ffd700;font-size:2rem;margin-bottom:.5rem}
.header p{color:rgba(200,220,255,.7)}
.top-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem}
.btn{background:linear-gradient(135deg,#c8960a,#ffd700);border:none;border-radius:10px;padding:.6rem 1.2rem;font-family:'Tajawal',sans-serif;font-weight:800;color:#1a0800;cursor:pointer;transition:all .2s}
.btn:hover{transform:translateY(-2px)}
.btn-outline{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.4);color:#ffd700}
.btn-outline:hover{background:rgba(255,215,0,.15)}
.btn-danger{background:rgba(200,50,50,.15);border:1px solid rgba(255,80,80,.5);color:#ff8888}
.btn-danger:hover{background:rgba(200,50,50,.3);color:#ffaaaa}
.search-box{display:flex;gap:.5rem;flex-wrap:wrap}
.search-box input{padding:.7rem 1rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.3);border-radius:10px;color:#fff;font-family:'Tajawal',sans-serif;width:250px}
.search-box input::placeholder{color:rgba(200,220,255,.5)}
.stats-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.stat-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.2);border-radius:15px;padding:1rem;text-align:center}
.stat-card .number{font-size:2rem;font-weight:900;color:#ffd700}
.stat-card .label{font-size:.8rem;color:rgba(200,220,255,.7)}
.students-table{background:rgba(255,255,255,.05);border-radius:15px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:rgba(255,215,0,.1);color:#ffd700;padding:1rem;text-align:center;font-weight:800}
td{padding:.8rem;text-align:center;border-bottom:1px solid rgba(255,255,255,.05);color:#e0e8ff;vertical-align:middle}
tr:hover td{background:rgba(255,215,0,.05)}
.gems{font-size:1.2rem;letter-spacing:.2rem}
.crown{color:#ffd700;font-size:1.2rem}
.status-badge{display:inline-block;padding:.2rem .8rem;border-radius:20px;font-size:.7rem;font-weight:700}
.status-complete{background:rgba(0,200,80,.2);color:#00ee77;border:1px solid #00ee77}
.status-incomplete{background:rgba(200,80,50,.2);color:#ffaa77;border:1px solid #ffaa77}
.detail-btn{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);border-radius:8px;padding:.3rem .8rem;font-size:.7rem;color:#ffd700;cursor:pointer;transition:all .2s}
.detail-btn:hover{background:rgba(255,215,0,.3)}
.delete-btn{background:rgba(200,50,50,.15);border:1px solid rgba(255,80,80,.5);border-radius:8px;padding:.3rem .8rem;font-size:.7rem;color:#ff8888;cursor:pointer;transition:all .2s;margin-right:.3rem}
.delete-btn:hover{background:rgba(200,50,50,.4);color:#ffaaaa}
.loading{display:flex;justify-content:center;align-items:center;padding:3rem;gap:.5rem}
.spinner{width:30px;height:30px;border:3px solid rgba(255,215,0,.3);border-top-color:#ffd700;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);backdrop-filter:blur(5px);align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:linear-gradient(145deg,#060c38,#0d1a72,#050a2e);border:2px solid rgba(255,215,0,.65);border-radius:20px;padding:1.8rem;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal-box h3{color:#ffd700;margin-bottom:1rem;text-align:center}
.modal-close{background:rgba(255,215,0,.15);border:1px solid #ffd700;border-radius:10px;padding:.4rem 1rem;color:#ffd700;cursor:pointer;margin-top:1rem;width:100%}
.modal-buttons{display:flex;gap:1rem;margin-top:1rem}
.modal-buttons .btn-confirm{background:rgba(200,50,50,.2);border:1px solid #ff5555;color:#ff8888}
.modal-buttons .btn-confirm:hover{background:rgba(200,50,50,.4)}
.modal-buttons .btn-cancel{background:rgba(255,215,0,.15);border:1px solid #ffd700;color:#ffd700}
.detail-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.1)}
.detail-label{font-weight:700;color:#ffd700}
.detail-value{color:#e0e8ff}
.palace-list{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.palace-item{background:rgba(255,255,255,.08);border-radius:8px;padding:.3rem .7rem;font-size:.8rem}
.palace-complete{background:rgba(0,200,80,.2);border:1px solid #00ee77;color:#00ee77}
.palace-incomplete{background:rgba(200,80,50,.2);border:1px solid #ffaa77;color:#ffaa77}
.empty-state{text-align:center;padding:3rem;color:rgba(200,220,255,.5)}
.empty-state span{font-size:3rem;display:block;margin-bottom:1rem}
.refresh-btn{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:.5rem;cursor:pointer}
@media(max-width:768px){
  body{padding:1rem}
  th,td{padding:.5rem;font-size:.7rem}
  .gems{font-size:.8rem}
  .detail-btn,.delete-btn{padding:.2rem .5rem;font-size:.6rem}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📚 سجل متابعة الطالبات</h1>
    <p>عرض جميع الطالبات المسجلات وتقدمهن في جزيرة العلوم</p>
  </div>

  <div class="top-bar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 بحث باسم الطالبة أو الكود..." onkeyup="filterTable()">
      <button class="btn btn-outline" onclick="clearSearch()">🗑️ مسح البحث</button>
    </div>
    <div>
      <button class="btn" onclick="refreshData()">🔄 تحديث البيانات</button>
      <button class="btn btn-outline" onclick="location.href='intro.html'">🏝️ الرئيسية</button>
      <button class="btn btn-outline" onclick="location.href='map.html'">🗺️ الخريطة</button>
      <button class="btn btn-outline" onclick="location.href='leaderboard.html'">🏆 سجل الأبطال</button>
    </div>
  </div>

  <div class="stats-cards" id="statsCards">
    <div class="stat-card"><div class="number" id="totalStudents">0</div><div class="label">👩‍🎓 إجمالي الطالبات</div></div>
    <div class="stat-card"><div class="number" id="totalGems">0</div><div class="label">💎 إجمالي الجواهر المجمعة</div></div>
    <div class="stat-card"><div class="number" id="totalPoints">0</div><div class="label">🏆 إجمالي النقاط</div></div>
    <div class="stat-card"><div class="number" id="crownCount">0</div><div class="label">👑 ملكات الجزيرة</div></div>
  </div>

  <div class="students-table">
    <div id="tableContent">
      <div class="loading"><div class="spinner"></div><span>جاري تحميل بيانات الطالبات...</span></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3>📋 تفاصيل الطالبة</h3>
    <div id="modalContent"></div>
    <button class="modal-close" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<div class="modal-overlay" id="deleteConfirmModal">
  <div class="modal-box">
    <h3>⚠️ تأكيد الحذف</h3>
    <div id="deleteModalContent"></div>
    <div class="modal-buttons">
      <button class="modal-close btn-cancel" onclick="closeDeleteModal()">إلغاء</button>
      <button class="modal-close btn-confirm" onclick="confirmDelete()">حذف</button>
    </div>
  </div>
</div>

<script>
// ============================================
// JSONBin.io CONFIGURATION
// ============================================
const JSONBIN_API_KEY = '$2a$10$mZzdzJHkljqyVEypW25Rh.VhLOqOXh90LsFE9AUO.kg1gq51akawS';
const JSONBIN_BIN_ID = '6a2ff230f5f4af5e29f50af7';
// ============================================

let allStudents = [];
let filteredStudents = [];
let studentToDelete = null;

// JSONBin.io API functions
async function fetchAllData() {
  try {
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { 'X-Master-Key': JSONBIN_API_KEY }
    });
    if (!response.ok) {
      console.error('Fetch failed:', response.status);
      return { students: [], leaderboard: [] };
    }
    const data = await response.json();
    return data.record;
  } catch(e) {
    console.error('Error fetching data:', e);
    return { students: [], leaderboard: [] };
  }
}

async function saveAllData(data) {
  try {
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(data)
    });
    if (!response.ok) {
      console.error('Save failed:', response.status);
      return false;
    }
    return true;
  } catch(e) {
    console.error('Error saving data:', e);
    return false;
  }
}

async function loadStudents() {
  const tableContent = document.getElementById('tableContent');
  tableContent.innerHTML = '<div class="loading"><div class="spinner"></div><span>جاري تحميل بيانات الطالبات...</span></div>';
  
  try {
    const allData = await fetchAllData();
    allStudents = allData.students || [];
    filteredStudents = [...allStudents];
    
    updateStats();
    renderTable();
  } catch(e) {
    console.error('Error loading students:', e);
    tableContent.innerHTML = `<div class="empty-state"><span>⚠️</span>حدث خطأ في تحميل البيانات<br><small>الرجاء المحاولة مرة أخرى</small></div>`;
  }
}

function updateStats() {
  const total = allStudents.length;
  const totalGems = allStudents.reduce((sum, s) => sum + (s.progress?.gems?.length || 0), 0);
  const totalPoints = allStudents.reduce((sum, s) => sum + (s.progress?.points || 0), 0);
  const crownCount = allStudents.filter(s => s.progress?.completedCastles?.includes(5)).length;
  
  document.getElementById('totalStudents').textContent = total;
  document.getElementById('totalGems').textContent = totalGems;
  document.getElementById('totalPoints').textContent = totalPoints.toLocaleString('ar-EG');
  document.getElementById('crownCount').textContent = crownCount;
}

function getGemsDisplay(gems) {
  let display = '';
  for (let i = 1; i <= 4; i++) {
    if (gems && gems.includes(i)) {
      display += i === 1 ? '💙 ' : i === 2 ? '💚 ' : i === 3 ? '🧡 ' : '💜 ';
    } else {
      display += '⬜ ';
    }
  }
  return display.trim();
}

function renderTable() {
  const tableContent = document.getElementById('tableContent');
  
  if (filteredStudents.length === 0) {
    tableContent.innerHTML = `<div class="empty-state"><span>📭</span>لا توجد طالبات مسجلات<br><small>سجلي طالبات جديدة لظهورهن هنا</small></div>`;
    return;
  }
  
  const rows = filteredStudents.map((student, index) => {
    const progress = student.progress || { gems: [], points: 0, completedCastles: [] };
    const gemsCount = progress.gems?.length || 0;
    const hasCrown = progress.completedCastles?.includes(5) || false;
    const castlesCompleted = progress.completedCastles?.length || 0;
    
    return `
      <tr>
        <td>${index + 1}</td>
        <td style="text-align:right;font-weight:700">👸 ${student.name}</td>
        <td>${student.cls || '—'}</td>
        <td>${student.school || '—'}</td>
        <td>${student.teacher || '—'}</td>
        <td><span class="gems">${getGemsDisplay(progress.gems)}</span></td>
        <td>${gemsCount}/4 ${hasCrown ? '<span class="crown">👑</span>' : ''}</td>
        <td>${castlesCompleted}/5</td>
        <td class="points" style="color:#ffd700;font-weight:800">${(progress.points || 0).toLocaleString('ar-EG')}</td>
        <td style="white-space:nowrap">
          <button class="detail-btn" onclick="showDetails('${student.studentCode}')">📋 تفاصيل</button>
          <button class="delete-btn" onclick="showDeleteConfirm('${student.studentCode}', '${student.name}')">🗑️ حذف</button>
        </td>
      </tr>
    `;
  }).join('');
  
  tableContent.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>الطالبة</th>
          <th>الشعبة</th>
          <th>المدرسة</th>
          <th>معلمة العلوم</th>
          <th>الجواهر</th>
          <th>المجموع</th>
          <th>القصور</th>
          <th>النقاط</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

function showDeleteConfirm(studentCode, studentName) {
  studentToDelete = studentCode;
  const modalContent = document.getElementById('deleteModalContent');
  modalContent.innerHTML = `
    <p style="text-align:center;margin-bottom:1rem">هل أنت متأكدة من حذف بيانات الطالبة؟</p>
    <div class="detail-row"><span class="detail-label">👸 الاسم:</span><span class="detail-value">${studentName}</span></div>
    <p style="text-align:center;margin-top:1rem;color:#ff8888;font-size:.8rem">⚠️ هذا الإجراء لا يمكن التراجع عنه!</p>
  `;
  document.getElementById('deleteConfirmModal').classList.add('show');
}

function closeDeleteModal() {
  document.getElementById('deleteConfirmModal').classList.remove('show');
  studentToDelete = null;
}

async function confirmDelete() {
  if (!studentToDelete) return;
  
  try {
    const allData = await fetchAllData();
    
    // Remove student from students array
    const studentIndex = allData.students.findIndex(s => s.studentCode === studentToDelete);
    if (studentIndex !== -1) {
      allData.students.splice(studentIndex, 1);
    }
    
    // Remove student from leaderboard
    const lbIndex = allData.leaderboard.findIndex(lb => lb.studentCode === studentToDelete);
    if (lbIndex !== -1) {
      allData.leaderboard.splice(lbIndex, 1);
    }
    
    // Save back to JSONBin
    const saved = await saveAllData(allData);
    
    if (saved) {
      // Also clear local storage for this student
      localStorage.removeItem('scienceIslandStudent_' + studentToDelete);
      localStorage.removeItem('scienceIslandProgress_' + studentToDelete);
      if (localStorage.getItem('currentStudentCode') === studentToDelete) {
        localStorage.removeItem('currentStudentCode');
        localStorage.removeItem('scienceIslandStudent');
      }
      
      await loadStudents();
      alert('✅ تم حذف بيانات الطالبة بنجاح');
    } else {
      alert('❌ حدث خطأ في حذف البيانات');
    }
  } catch(e) {
    console.error('Error deleting student:', e);
    alert('❌ حدث خطأ في حذف البيانات');
  } finally {
    closeDeleteModal();
  }
}

function showDetails(studentCode) {
  const student = allStudents.find(s => s.studentCode === studentCode);
  if (!student) return;
  
  const progress = student.progress || { gems: [], points: 0, completedCastles: [], castleScores: {} };
  const gems = progress.gems || [];
  
  const palaces = [
    { id: 1, name: 'قصر المعرفة', gem: '💙', required: 1 },
    { id: 2, name: 'قصر الفهم', gem: '💚', required: 2 },
    { id: 3, name: 'قصر التطبيق', gem: '🧡', required: 3 },
    { id: 4, name: 'قصر التحليل', gem: '💜', required: 4 },
    { id: 5, name: 'القلعة الملكية', gem: '👑', required: 5 }
  ];
  
  const palacesHtml = palaces.map(palace => {
    const isCompleted = progress.completedCastles?.includes(palace.id);
    const score = progress.castleScores?.[palace.id] || 0;
    return `
      <div class="palace-item ${isCompleted ? 'palace-complete' : 'palace-incomplete'}">
        ${palace.gem} ${palace.name} ${isCompleted ? '✅' : '❌'}
        ${isCompleted ? `<small>(${score} نقطة)</small>` : ''}
      </div>
    `;
  }).join('');
  
  const modalContent = `
    <div class="detail-row"><span class="detail-label">👸 الاسم الكامل:</span><span class="detail-value">${student.name}</span></div>
    <div class="detail-row"><span class="detail-label">🔑 كود الطالبة:</span><span class="detail-value">${student.studentCode}</span></div>
    <div class="detail-row"><span class="detail-label">📚 الشعبة:</span><span class="detail-value">${student.cls || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">🏫 المدرسة:</span><span class="detail-value">${student.school || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">👩‍🏫 معلمة العلوم:</span><span class="detail-value">${student.teacher || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">💎 الجواهر المجمعة:</span><span class="detail-value">${gems.length}/4 ${getGemsDisplay(gems)}</span></div>
    <div class="detail-row"><span class="detail-label">🏆 النقاط الإجمالية:</span><span class="detail-value" style="color:#ffd700;font-weight:800">${(progress.points || 0).toLocaleString('ar-EG')}</span></div>
    <div class="detail-row"><span class="detail-label">👑 التاج الملكي:</span><span class="detail-value">${progress.completedCastles?.includes(5) ? '✅ تم الحصول على التاج' : '❌ لم يتم بعد'}</span></div>
    <div class="detail-row"><span class="detail-label">📅 تاريخ التسجيل:</span><span class="detail-value">${student.registeredAt ? new Date(student.registeredAt).toLocaleDateString('ar-AE') : '—'}</span></div>
    <div class="detail-row"><span class="detail-label">🕐 آخر تحديث:</span><span class="detail-value">${student.lastUpdated ? new Date(student.lastUpdated).toLocaleString('ar-AE') : '—'}</span></div>
    <div style="margin-top:1rem"><span class="detail-label">🏰 تقدم القصور:</span></div>
    <div class="palace-list">${palacesHtml}</div>
  `;
  
  document.getElementById('modalContent').innerHTML = modalContent;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function filterTable() {
  const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
  
  if (searchTerm === '') {
    filteredStudents = [...allStudents];
  } else {
    filteredStudents = allStudents.filter(student => 
      student.name.toLowerCase().includes(searchTerm) ||
      (student.studentCode && student.studentCode.toLowerCase().includes(searchTerm)) ||
      (student.cls && student.cls.toString().includes(searchTerm))
    );
  }
  
  renderTable();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  filteredStudents = [...allStudents];
  renderTable();
}

async function refreshData() {
  await loadStudents();
}

// Close modals when clicking outside
document.addEventListener('click', function(event) {
  const modal = document.getElementById('modal');
  const deleteModal = document.getElementById('deleteConfirmModal');
  if (event.target === modal) closeModal();
  if (event.target === deleteModal) closeDeleteModal();
});

// Load data on page load
loadStudents();
</script>
</body>
</html>
